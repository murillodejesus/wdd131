<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Avaliação de Produto</title>
    <meta name="description" content="Form">
    <meta name="author" content="Murillo de Jesus">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <h1>Avalie o Produto</h1>
    </header>
    <main>
        <form id="reviewForm" method="get" action="review.html">
            <fieldset>
                <legend>Detalhes da Avaliação</legend>
                <div class="form-group">
                    <label for="productName">Nome do Produto</label>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Selecione um Produto...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Avaliação Geral</label>
                    <div class="rating-stars">
                        <input type="radio" id="rating5" name="overallRating" value="5" required>
                        <label for="rating5">☆</label>
                        <input type="radio" id="rating4" name="overallRating" value="4" required>
                        <label for="rating4">☆</label>
                        <input type="radio" id="rating3" name="overallRating" value="3" required>
                        <label for="rating3">☆</label>
                        <input type="radio" id="rating2" name="overallRating" value="2" required>
                        <label for="rating2">☆</label>
                        <input type="radio" id="rating1" name="overallRating" value="1" required>
                        <label for="rating1">☆</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="installDate">Data de Instalação</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>
                <div class="form-group">
                    <label>Funcionalidades Úteis (selecione todas que se aplicam)</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="feature1" name="usefulFeatures" value="durabilidade">
                        <label for="feature1">Durabilidade</label>
                        <input type="checkbox" id="feature2" name="usefulFeatures" value="facilidade-de-uso">
                        <label for="feature2">Facilidade de Uso</label>
                        <input type="checkbox" id="feature3" name="usefulFeatures" value="desempenho">
                        <label for="feature3">Desempenho</label>
                        <input type="checkbox" id="feature4" name="usefulFeatures" value="design">
                        <label for="feature4">Design</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reviewText">Comentário Escrito</label>
                    <textarea id="reviewText" name="reviewText"></textarea>
                </div>
                <div class="form-group">
                    <label for="userName">Seu Nome (opcional)</label>
                    <input type="text" id="userName" name="userName">
                </div>
            </fieldset>
            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>
    <footer>
        <p>WDD 130 | Murillo de Jesus</p>
    </footer>
    <script src="scripts/main.js"></script>
</body>
</html>
